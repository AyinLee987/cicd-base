name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # pom.xml declares java.version=23, but the bundled Lombok 1.18.36 does
      # not support javac >= 24 and fails to compile on newer JDKs. JDK 17
      # is what we verified locally, so pin it here too.
      - name: Run tests with Maven
        run: ./mvnw -B test -Djava.version=17

  snyk:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        continue-on-error: true # don't fail the whole workflow on found vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
